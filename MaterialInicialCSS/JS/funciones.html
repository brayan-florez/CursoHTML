        }

        function multiplos() {
            let a = parseInt(prompt("Ingrese el primer número: "));
            let b = parseInt(prompt("Ingrese el segundo número: "));
            if (b % a === 0) {
                alert("B es múltiplo de A")
            }

                alert("B NO es múltiplo de A")

            }
        }

        function palabras() {

        function dividir() {
            let a = parseInt(prompt("Ingrese el primer número: "));

        }
